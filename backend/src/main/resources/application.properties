# Application Configuration
spring.application.name=earlyflag-backend
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/earlyflag_db}
spring.datasource.username=${DB_USER:earlyflag}
spring.datasource.password=${DB_PASSWORD:earlyflag123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration (Multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
